<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Sensor Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin: 0;
  background: #0f172a;
  font-family: 'Inter', sans-serif;
  color: white;
}

header {
  padding: 20px;
  font-size: 22px;
  font-weight: 600;
  background: #111827;
}

.container {
  padding: 20px;
  max-width: 1400px;
  margin: auto;
}

/* ================= SENSOR CARDS ================= */

.sensor-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.sensor-card {
  position: relative;
  height: 200px;
  border-radius: 18px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.3s ease;
}

.sensor-card:hover {
  transform: scale(1.05);
}

.card-front,
.card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  padding: 20px;
  transition: opacity 0.3s ease;
}

.card-front {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.card-front h2 {
  margin: 0;
  font-size: 22px;
}

.card-front p {
  font-size: 26px;
  font-weight: 600;
}

.card-back {
  background: #111827;
  opacity: 0;
}

.sensor-card:hover .card-front { opacity: 0; }
.sensor-card:hover .card-back { opacity: 1; }

.tds { background: #1d4ed8; }
.ph { background: #16a34a; }
.temp { background: #f97316; }
.turb { background: #9333ea; }

.sensor-card canvas {
  width: 100% !important;
  height: 150px !important;
}

/* ================= WQI ================= */

.wqi-card {
  margin-top: 30px;
  background: #1e293b;
  padding: 20px;
  border-radius: 16px;
}

.wqi-bar-bg {
  height: 18px;
  background: #0f172a;
  border-radius: 999px;
  overflow: hidden;
}

.wqi-bar-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  transition: width 0.5s ease;
}

/* ================= MAP ================= */

.map-card {
  margin-top: 30px;
  background: #1e293b;
  padding: 20px;
  border-radius: 16px;
}

#map {
  height: 400px;
  border-radius: 12px;
}

button {
  margin-top: 15px;
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.refresh-btn { background: #2563eb; color: white; }
.reset-btn { background: #ef4444; color: white; }

@media(max-width: 900px){
  .sensor-cards { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

<body>

<header>Water Quality Monitoring Dashboard</header>

<div class="container">

<!-- SENSOR CARDS -->
<div class="sensor-cards">

  <div class="sensor-card tds">
    <div class="card-front">
      <h2>TDS</h2>
      <p id="tdsMetric">-- ppm</p>
    </div>
    <div class="card-back">
      <canvas id="tdsMiniChart"></canvas>
    </div>
  </div>

  <div class="sensor-card ph">
    <div class="card-front">
      <h2>pH</h2>
      <p id="phMetric">--</p>
    </div>
    <div class="card-back">
      <canvas id="phMiniChart"></canvas>
    </div>
  </div>

  <div class="sensor-card temp">
    <div class="card-front">
      <h2>Temperature</h2>
      <p id="tempMetric">-- °C</p>
    </div>
    <div class="card-back">
      <canvas id="tempMiniChart"></canvas>
    </div>
  </div>

  <div class="sensor-card turb">
    <div class="card-front">
      <h2>Turbidity</h2>
      <p id="turbMetric">--</p>
    </div>
    <div class="card-back">
      <canvas id="turbMiniChart"></canvas>
    </div>
  </div>

</div>

<!-- WQI -->
<div class="wqi-card">
  <h3>Water Quality Index (0–100)</h3>
  <div id="wqiScore">-- / 100</div>
  <div class="wqi-bar-bg">
    <div class="wqi-bar-fill" id="wqiFill"></div>
  </div>
</div>

<!-- MAP -->
<div class="map-card">
  <h3>Live Location Map</h3>
  <div id="map"></div>
  <button class="refresh-btn" id="refreshMapBtn">🔄 Refresh Map</button>
  <button class="reset-btn" id="resetBtn">⚠ Reset All Data</button>
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const FIREBASE_DB = "https://water-sensor-project-default-rtdb.asia-southeast1.firebasedatabase.app";
const DEVICE_ID = "device1";

let fullHistory = [];

/* ================= MINI CHARTS ================= */

function createMiniChart(id, color){
  return new Chart(document.getElementById(id),{
    type:'line',
    data:{ labels:[], datasets:[{ data:[], borderColor:color, tension:0.3 }]},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{ legend:{ display:false }},
      scales:{ x:{ display:false }, y:{ display:false }}
    }
  });
}

const tdsMini = createMiniChart("tdsMiniChart","#3b82f6");
const phMini = createMiniChart("phMiniChart","#22c55e");
const tempMini = createMiniChart("tempMiniChart","#f97316");
const turbMini = createMiniChart("turbMiniChart","#a855f7");

/* ================= LOAD HISTORY ================= */

async function loadHistory(){
  const res = await fetch(`${FIREBASE_DB}/devices/${DEVICE_ID}/history.json`);
  const data = await res.json();
  if(!data) return;

  fullHistory = Object.values(data).sort((a,b)=>a.ts-b.ts).slice(-50);
  updateUI();
}

function updateUI(){
  if(!fullHistory.length) return;

  const last = fullHistory[fullHistory.length-1];

  document.getElementById("tdsMetric").innerText = last.tds+" ppm";
  document.getElementById("phMetric").innerText = last.pH;
  document.getElementById("tempMetric").innerText = last.temp+" °C";
  document.getElementById("turbMetric").innerText = last.turb;

  updateMini();
  updateWQI(last);
}

function updateMini(){
  const labels = fullHistory.map(d=>d.time);

  tdsMini.data.labels = labels;
  tdsMini.data.datasets[0].data = fullHistory.map(d=>d.tds);

  phMini.data.labels = labels;
  phMini.data.datasets[0].data = fullHistory.map(d=>d.pH);

  tempMini.data.labels = labels;
  tempMini.data.datasets[0].data = fullHistory.map(d=>d.temp);

  turbMini.data.labels = labels;
  turbMini.data.datasets[0].data = fullHistory.map(d=>d.turb);

  tdsMini.update();
  phMini.update();
  tempMini.update();
  turbMini.update();
}

/* ================= WQI ================= */

function updateWQI(d){
  let score = 100;
  if(d.pH<6.5||d.pH>8.5||d.tds>500||d.temp>35||d.turb>10) score=40;
  document.getElementById("wqiScore").innerText=score+" / 100";
  document.getElementById("wqiFill").style.width=score+"%";
}

loadHistory();
setInterval(loadHistory,10000);

/* ================= MAP ================= */

const map = L.map('map').setView([21.17,72.83],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let markers={};

async function loadPins(){
  const res=await fetch(`${FIREBASE_DB}/devices/${DEVICE_ID}/pins.json`);
  const pins=await res.json();
  if(!pins) return;

  for(const id in pins){
    const d=pins[id];
    if(!d.lat||!d.lng) continue;

    if(!markers[id]){
      markers[id]=L.circleMarker([d.lat,d.lng],{
        radius:10,color:d.status==="UNSAFE"?"red":"green",
        fillOpacity:0.8
      }).addTo(map);
    }
  }
}

loadPins();
setInterval(loadPins,10000);

document.getElementById("refreshMapBtn").onclick=loadPins;

document.getElementById("resetBtn").onclick=async()=>{
  const pass=prompt("Enter password");
  if(!pass) return;
  await fetch(`/reset?password=${pass}&id=${DEVICE_ID}`);
  alert("Reset Done");
  location.reload();
};
</script>
</body>
</html>
